<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac To Go</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================
         SPLASH SCREEN
    ========================== -->

    <div id="splashScreen" class="splash-screen">

        <div class="splash-content">

            <div class="splash-symbols">
                <span class="symbol-x">✕</span>
                <span class="symbol-o">○</span>
            </div>

            <h1 class="splash-title">
                TIC TAC
            </h1>

            <button id="goBtn" class="go-btn">
                GO
            </button>

        </div>

    </div>


    <!-- =========================
         CONTAINER
    ========================== -->

    <div class="container">

        <!-- =========================
             MENU UTAMA
        ========================== -->

        <section id="menu" class="screen active">

            <div class="menu-logo">

                <div class="menu-symbols">
                    <span>✕</span>
                    <span>○</span>
                </div>

                <h1>TIC TAC TO GO</h1>

                <p>PLAY TOGETHER</p>

            </div>


            <!-- =========================
                 TAMBAHAN: PILIH MODE
            ========================== -->

            <div class="player-select mode-select">

                <h3>PILIH MODE</h3>

                <div class="mode-buttons">

                    <button
                        class="mode-btn selected"
                        data-mode="friend"
                    >

                        <span>👥</span>

                        <small>
                            TEMAN
                        </small>

                    </button>


                    <button
                        class="mode-btn"
                        data-mode="computer"
                    >

                        <span>🤖</span>

                        <small>
                            KOMPUTER
                        </small>

                    </button>

                </div>

            </div>


            <!-- PILIH TEAM -->

            <div class="player-select">

                <h3>PILIH TIM</h3>

                <div class="team-buttons">

                    <button
                        class="team-btn selected"
                        data-team="X"
                    >

                        <span>✕</span>

                        <small>
                            TEAM X
                        </small>

                    </button>


                    <button
                        class="team-btn"
                        data-team="O"
                    >

                        <span>○</span>

                        <small>
                            TEAM O
                        </small>

                    </button>

                </div>

            </div>


            <button id="startBtn" class="main-btn">

                MULAI GAME

                <span>→</span>

            </button>

        </section>


        <!-- =========================
             HALAMAN GAME
        ========================== -->

        <section id="game" class="screen">

            <!-- HEADER -->

            <div class="game-header">

                <button id="backBtn" class="icon-btn">
                    ←
                </button>


                <div class="game-title">

                    <h2>
                        TIC TAC TO GO
                    </h2>

                    <p id="gameModeText">
                        PLAY TOGETHER
                    </p>

                </div>


                <button
                    id="resetScoreBtn"
                    class="icon-btn"
                >
                    ↻
                </button>

            </div>


            <!-- SCORE -->

            <div class="score-board">

                <div class="score-card x-card">

                    <div class="score-symbol">
                        ✕
                    </div>

                    <span id="scoreXLabel">
                        TEAM X
                    </span>

                    <strong id="scoreX">
                        0
                    </strong>

                </div>


                <div class="vs">
                    VS
                </div>


                <div class="score-card o-card">

                    <div class="score-symbol">
                        ○
                    </div>

                    <span id="scoreOLabel">
                        TEAM O
                    </span>

                    <strong id="scoreO">
                        0
                    </strong>

                </div>

            </div>


            <!-- GILIRAN -->

            <div class="turn-box">

                <span id="turnSymbol">
                    ✕
                </span>

                <span>
                    GILIRAN TEAM
                    <b id="turnText">X</b>
                </span>

            </div>


            <!-- BOARD -->

            <div id="board" class="board">

                <button class="cell" data-index="0"></button>
                <button class="cell" data-index="1"></button>
                <button class="cell" data-index="2"></button>

                <button class="cell" data-index="3"></button>
                <button class="cell" data-index="4"></button>
                <button class="cell" data-index="5"></button>

                <button class="cell" data-index="6"></button>
                <button class="cell" data-index="7"></button>
                <button class="cell" data-index="8"></button>

            </div>


            <!-- MAIN LAGI -->

            <button
                id="newGameBtn"
                class="new-game-btn"
            >
                🔄 MAIN LAGI
            </button>

        </section>

    </div>


    <!-- =========================
         MODAL HASIL
    ========================== -->

    <div id="resultModal" class="modal">

        <div class="modal-content">

            <div
                id="resultIcon"
                class="result-icon"
            >
                🏆
            </div>

            <h2 id="resultTitle">
                TEAM X MENANG!
            </h2>

            <p id="resultText">
                Selamat! Team X berhasil memenangkan permainan.
            </p>


            <div class="result-score">

                <span>
                    ✕
                    <b id="finalScoreX">0</b>
                </span>

                <span class="result-dash">
                    —
                </span>

                <span>
                    <b id="finalScoreO">0</b>
                    ○
                </span>

            </div>


            <button
                id="playAgainBtn"
                class="main-btn"
            >
                MAIN LAGI →
            </button>


            <button
                id="menuBtn"
                class="menu-btn"
            >
                🏠 MENU UTAMA
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
